# AI Center 模块注册表配置
# 定义所有功能模块的API前缀、前端路由、数据库表、依赖关系
# 此文件是版本控制的核心配置，用于决定哪些模块在某个版本中可用

# 版本信息
version:
  name: "full"  # 版本名称: full(满血版) / custom(自定义版)
  description: "满血版 - 包含所有功能模块"
  enabled_modules:
    - user
    - llm_model
    - prompt
    - datasource
    - knowledgebase
    - mcp
    - chatbot
    - chat
    - agent
    - system_monitor
    - integration
    - ontology
    - task_center
    - toolkit
    - api

# 模块定义
modules:
  # ==================== 核心模块 ====================
  user:
    name: "用户管理"
    description: "用户账号管理、权限控制"
    required: true  # 核心模块，所有版本必须启用
    api_prefixes:
      - "/user"
    frontend_routes:
      - "/users"
    menu_keys:
      - "user"
    database_tables:
      - "user"
    dependencies: []

  llm_model:
    name: "模型管理"
    description: "大语言模型配置与管理"
    required: false
    api_prefixes:
      - "/llm_model"
    frontend_routes:
      - "/llm_models"
      - "/llm_model/setting/:id"
    menu_keys:
      - "llm_model"
    database_tables:
      - "llm_model"
      - "llm_category"
    dependencies: []

  prompt:
    name: "提示词"
    description: "系统提示词模板管理"
    required: false
    api_prefixes:
      - "/prompt"
    frontend_routes:
      - "/prompts"
      - "/prompt/setting/:id"
    menu_keys:
      - "prompt"
    database_tables:
      - "prompt"
      - "prompt_category"
    dependencies: []

  datasource:
    name: "数据源"
    description: "外部数据源连接配置"
    required: false
    api_prefixes:
      - "/datasource"
      - "/datasource_category"
    frontend_routes:
      - "/datasources"
    menu_keys:
      - "datasource"
    database_tables:
      - "datasource"
      - "datasource_category"
    dependencies: []

  knowledgebase:
    name: "知识库"
    description: "文档知识库、向量检索"
    required: false
    api_prefixes:
      - "/knowledgebase"
    frontend_routes:
      - "/knowledgebases"
      - "/knowledgebase/create"
      - "/knowledgebase/detail/:id"
    menu_keys:
      - "knowledgebase"
    database_tables:
      - "knowledgebase"
      - "knowledgebase_category"
      - "knowledgebase_document"
    dependencies:
      - "llm_model"

  mcp:
    name: "MCP服务"
    description: "MCP服务管理"
    required: false
    api_prefixes:
      - "/mcp"
    frontend_routes:
      - "/mcps"
      - "/mcp/setting/:id"
    menu_keys:
      - "mcp"
    database_tables:
      - "mcp_server"
      - "mcp_category"
      - "mcp_tool"
    dependencies: []

  toolkit:
    name: "工具箱"
    description: "自定义工具和API"
    required: false
    api_prefixes:
      - "/toolkit"
    frontend_routes:
      - "/toolkit"
    menu_keys:
      - "toolkit"
    database_tables:
      - "toolkit_category"
    dependencies:
      - mcp
      - api

  api:
    name: "API接口"
    description: "API服务分类、配置与接口管理"
    required: false
    api_prefixes:
      - "/api_server"
    frontend_routes:
      - "/toolkit"
      - "/api/setting/:id"
    menu_keys:
      - "api"
    database_tables:
      - "api_server_category"
      - "api_server"
      - "api"
    dependencies: []

  chatbot:
    name: "机器人"
    description: "AI机器人创建与配置"
    required: false
    api_prefixes:
      - "/chatbot"
      - "/chatbot_category"
    frontend_routes:
      - "/chatbots"
      - "/chatbot/setting/:id"
    menu_keys:
      - "chatbot"
    database_tables:
      - "chatbot"
      - "chatbot_category"
      - "chatbot_model"
    dependencies:
      - "user"
      - "llm_model"
      - "prompt"
      - "knowledgebase"
      - "mcp"
      - "toolkit"

  chat:
    name: "聊天"
    description: "用户对话与消息"
    required: false
    api_prefixes:
      - "/chat"
    frontend_routes:
      - "/chats"
    menu_keys:
      - "chat"
    database_tables:
      - "chat"
      - "chat_message"
    dependencies:
      - "user"
      - "llm_model"
      - "chatbot"

  agent:
    name: "智能体"
    description: "Agent工作流编排"
    required: false
    api_prefixes:
      - "/agent"
    frontend_routes:
      - "/agents"
      - "/agent/setting/:id"
    menu_keys:
      - "agent"
    database_tables:
      - "agent_instance"
      - "agent_category"
      - "agent_component"
    dependencies:
      - "user"
      - "llm_model"
      - "chatbot"

  system_monitor:
    name: "系统监控"
    description: "系统运行状态监控"
    required: false
    api_prefixes:
      - "/system"
    frontend_routes:
      - "/system/monitor"
    menu_keys:
      - "system_monitor"
    database_tables: []
    dependencies:
      - "user"

  integration:
    name: "插件集成"
    description: "第三方集成与API"
    required: false
    api_prefixes:
      - "/integration"
    frontend_routes:
      - "/integration/chat"
      - "/integration/sidebar"
      - "/integration/preview"
    menu_keys: []
    database_tables:
      - "chatbot_chat"
      - "chatbot_chat_message"
    dependencies:
      - "user"
      - "llm_model"
      - "chatbot"

  ontology:
    name: "本体工作台"
    description: "本体对象与数据抽取"
    required: false
    api_prefixes:
      - "/ontology"
    frontend_routes:
      - "/ontology/objects"
      - "/ontology/tasks"
    menu_keys:
      - "ontology"
    database_tables:
      - "ontology_object"
      - "ontology_task"
    dependencies:
      - "user"
      - "datasource"

  task_center:
    name: "任务中心"
    description: "任务执行与日志管理"
    required: false
    api_prefixes:
      - "/task_center"
    frontend_routes:
      - "/task_center/tasks"
      - "/task_center/logs"
    menu_keys:
      - "task_center"
    database_tables:
      - "task_info"
      - "task_log"
    dependencies:
      - "user"